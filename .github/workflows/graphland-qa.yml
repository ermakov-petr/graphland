name: GraphLand behavioral QA

"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: graphland-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dgl-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DGLBACKEND: pytorch
      DGL_IMPORT_GRAPHBOLT: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch compatible with DGL 2.4 metadata
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.4.0+cpu
      - name: Install official DGL 2.4 CPU build
        run: |
          archive="$RUNNER_TEMP/dgl-2.4.0.th24.cpu-py311_0.tar.bz2"
          dgl_prefix="$RUNNER_TEMP/dgl"
          dgl_site="$dgl_prefix/lib/python3.11/site-packages"
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 10 --max-time 60 \
            "https://conda.anaconda.org/dglteam/label/th24_cpu/linux-64/dgl-2.4.0.th24.cpu-py311_0.tar.bz2" \
            --output "$archive"
          printf '%s  %s\n' '6e87ab565157965ffc1de9175a02bdfc113a63f22a0f74436f9d503fe22cfc79' "$archive" \
            | sha256sum --check
          # The upstream package requires no Conda prefix relocation.
          mkdir -p "$dgl_prefix"
          tar -xjf "$archive" -C "$dgl_prefix" lib/python3.11/site-packages
          python -m pip install --only-binary=:all: 'numpy==1.26.4' 'torch==2.4.0+cpu' \
            --requirement "$dgl_site/dgl-2.4.0-py3.11.egg-info/requires.txt"
          printf 'PYTHONPATH=%s\n' "$dgl_site" >> "$GITHUB_ENV"
      - name: Run every graph model with plain, PLR and PLR-lite features
        run: python -m unittest discover -s tests/dgl -v

  core-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch wheel
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
      - name: Install fixed research test dependencies
        run: python -m pip install -r requirements-core-test.txt
      - name: Run real CPU/PyG and Optuna regressions
        run: python -m unittest discover -s tests/core -v

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install hash-locked build dependencies
        run: "python -m pip install --require-hashes --only-binary=:all: -r requirements-leaderboard.txt"
      - name: Install fixed browser test dependencies
        run: python -m pip install -r requirements-browser-test.txt
      - name: Install pinned Chromium
        run: python -m playwright install chromium
      - name: Check Chromium runtime libraries
        run: |
          python - <<'PY'
          import subprocess
          import sys
          from playwright.sync_api import Error, sync_playwright

          for attempt in range(2):
              try:
                  with sync_playwright() as playwright:
                      browser = playwright.chromium.launch(timeout=15000)
                      browser.close()
                  break
              except Error as error:
                  missing_libraries = any(message in str(error) for message in (
                      "Host system is missing dependencies",
                      "error while loading shared libraries",
                  ))
                  if attempt or not missing_libraries:
                      raise
                  subprocess.run([sys.executable, "-m", "playwright", "install-deps", "chromium"], check=True)
          PY
      - name: Run Chromium behavioral regressions
        run: python -m unittest discover -s tests/browser -v
