name: Leaderboard issue to draft PR

"on":
  issues:
    types: [labeled, edited]

permissions: {}

concurrency:
  group: leaderboard-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  candidate:
    if: ${{ github.event.issue.pull_request == null && github.event.issue.state == 'open' && contains(github.event.issue.labels.*.name, 'leaderboard-ready') && (github.event.action == 'edited' || github.event.label.name == 'leaderboard-ready') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      outcome: ${{ steps.prepare.outputs.outcome }}
      source_sha: ${{ steps.prepare.outputs.source_sha }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install hash-locked leaderboard dependencies
        run: "python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-leaderboard.txt"
      - name: Run trusted unit and lifecycle tests
        run: python -m unittest discover -s tests/leaderboard -v
      - name: Prepare bounded candidate from approved Issue snapshot
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/leaderboard/automation.py prepare \
            --event-json "${GITHUB_EVENT_PATH}" \
            --candidate "${RUNNER_TEMP}/candidate" \
            --staging "${RUNNER_TEMP}/candidate-submissions"
      - name: Validate candidate repository data
        if: steps.prepare.outputs.outcome == 'ready'
        run: python scripts/leaderboard/validate.py --allow-pending --submissions-dir "${RUNNER_TEMP}/candidate-submissions"
      - name: Build complete read-only candidate
        if: steps.prepare.outputs.outcome == 'ready'
        run: python scripts/leaderboard/build.py --allow-pending --submissions-dir "${RUNNER_TEMP}/candidate-submissions" --output "${RUNNER_TEMP}/candidate-site"
      - name: Stage bounded candidate artifact
        if: success() && (steps.prepare.outputs.outcome == 'ready' || steps.prepare.outputs.outcome == 'invalid')
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: issue-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/
          retention-days: 1
          if-no-files-found: error

  mutation:
    needs: candidate
    if: ${{ needs.candidate.result == 'success' && (needs.candidate.outputs.outcome == 'ready' || needs.candidate.outputs.outcome == 'invalid') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout current trusted main for mutation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install hash-locked leaderboard dependencies
        run: "python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-leaderboard.txt"
      - name: Retrieve this run's candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: issue-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/
      - name: Revalidate current snapshot and update only bot-owned draft
        if: needs.candidate.outputs.outcome == 'ready'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/leaderboard/automation.py mutate --event-json "${GITHUB_EVENT_PATH}" --candidate "${RUNNER_TEMP}/candidate"
      - name: Deduplicate invalid submission notice
        if: needs.candidate.outputs.outcome == 'invalid'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/leaderboard/automation.py notify --event-json "${GITHUB_EVENT_PATH}" --candidate "${RUNNER_TEMP}/candidate"
      - name: Deduplicate unexpected automation failure
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/leaderboard/automation.py notify --event-json "${GITHUB_EVENT_PATH}"
